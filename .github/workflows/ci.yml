name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests + coverage (dogfoods `inertia-forge verify`)
        run: inertia-forge verify tests/ --cov inertia_forge

      - name: Smoke-test the CLI
        run: |
          inertia-forge skills
          inertia-forge skills validate
          inertia-forge arch src/inertia_forge/
